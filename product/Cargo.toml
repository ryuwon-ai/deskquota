[package]
name = "llmgw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native local quota gateway"
license = "MIT OR Apache-2.0"

[features]
bench-harness = []
bpe = ["dep:bpe-openai"]

[[example]]
name = "bench_gateway"
required-features = ["bench-harness"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1"] }
bytes = "=1.11.1"
bpe-openai = { version = "=0.3.1", optional = true }
clap = { version = "=4.6.6", features = ["derive"] }
dialoguer = { version = "=0.12.0", default-features = false }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
humantime = "=2.4.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "tokio"] }
jsonc-parser = { version = "=0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "=0.2.183"
quick-xml = { version = "=0.42.0", default-features = false }
rand = { version = "=0.10.2", default-features = false, features = ["thread_rng"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
socket2 = "=0.6.5"
tokio = { version = "=1.49.0", features = ["net", "rt-multi-thread", "rt", "macros", "time", "sync", "signal", "io-util"] }
toml_edit = { version = "=0.25.15", features = ["serde"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "=0.13.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[dev-dependencies]
rustls = "=0.23.44"
tokio = { version = "=1.49.0", features = ["test-util"] }
tokio-rustls = "=0.26.5"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
