listen = "127.0.0.1:4141"
concurrency = 1
cancel_policy = "drain"
accounting = "actual"
startup_hold_secs = 60

[upstream]
api_base = "http://127.0.0.1:18080/team/v1?api-version=fixture"

[upstream.auth]
mode = "none"

[quota.rpm]
kind = "known"
value = 60

[quota.tpm]
kind = "unknown"

[[models]]
id = "example-model"
max_output_tokens = 4096

[[models]]
id = "request-bounded-model"

[[roots]]
id = "pi-work"
endpoints = [
  "chat/completions",
  "responses",
  "messages",
  "messages/count_tokens",
  "models",
]
models = ["example-model", "request-bounded-model"]
