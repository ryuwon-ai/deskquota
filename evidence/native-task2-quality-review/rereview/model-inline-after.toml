# inline heading
models = [{ id = "model-b", max_output_tokens = 128 }] # models container
roots = [{ id = "pi", endpoints = ["responses"], models = ["model-b"] }] # roots container
# preserved user heading
listen = "127.0.0.1:56158" # port comment
concurrency = 3
accounting = "actual"
cancel_policy = "close"
retry_transient_429 = true
[upstream]
api_base = "http://127.0.0.1:56154/company/v1"
auth = { mode = "none" }
[quota]
rpm = { kind = "unlimited" }
tpm = { kind = "unlimited" }
